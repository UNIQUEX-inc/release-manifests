<h1>UNIQUEX release manifests</h1>
<p>セルフホスト製品の更新の通知と強制アップデートに使う、署名済みの台帳（release manifest）の一覧です。各台帳は <code>https://uniquex-inc.github.io/release-manifests/&lt;product&gt;/release-manifest.json</code> にあります。</p>
<table>
<thead><tr><th>product</th><th>台帳</th></tr></thead>
<tbody>
<tr><td colspan="2">まだ台帳はありません。最初の台帳は各製品の Ticket（REQ-1234 段 2）で発行します。</td></tr>
</tbody>
</table>
<p>署名の検証と発行の規則は <a href="https://github.com/UNIQUEX-inc/release-manifests#readme">README</a> を見てください。</p>
